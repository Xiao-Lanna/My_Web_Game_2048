<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="合合方块：离线也能玩的 2048，支持键盘、滑动、撤销和自动续局">
  <title>合合方块 · 2048</title>
  <style>
    /* 修改区 1：页面配色和棋盘间距 */
    :root {
      --page: #f6f3fa;
      --paper: #fffdfa;
      --ink: #3d3052;
      --muted: #7b7087;
      --accent: #7551ae;
      --accent-hover: #604191;
      --soft: #eee8f6;
      --line: #e5deed;
      --board: #d8cee4;
      --empty: #eae3f1;
      --gap: 10px;
    }
    * { box-sizing: border-box; }
    /* 页面固定占满可见窗口，由棋盘缩放适应空间，不靠滚动展示内容 */
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; }
    body { color: var(--ink); background: var(--page); font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; line-height: 1.5; }
    button { font: inherit; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    :focus-visible { outline: 3px solid #ba5a27; outline-offset: 4px; }
    .shell { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; width: min(1280px, 100%); height: 100vh; height: 100dvh; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 40px; }
    .brand { display: flex; align-items: center; gap: 11px; }
    .brand h1 { margin: 0; font-size: 21px; font-weight: 800; }
    .brand-mark { display: grid; grid-template-columns: repeat(2, 10px); gap: 3px; transform: rotate(-8deg); }
    .brand-mark i { width: 10px; height: 10px; border-radius: 3px; background: var(--accent); }
    .brand-mark i:last-child { background: #dfa369; }
    .target-chip { flex-shrink: 0; display: flex; align-items: center; gap: 9px; padding: 5px 13px; border: 1px solid var(--line); border-radius: 20px; color: var(--muted); font-size: 11px; }
    .target-chip b { color: var(--accent); font-size: 19px; }
    main { min-height: 0; }
    .game-card { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; width: 100%; height: 100%; min-height: 0; padding: 20px; border: 1px solid var(--line); border-radius: 22px; background: var(--paper); }
    .score-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; }
    .score-label { font-size: 10px; letter-spacing: 1px; color: var(--muted); }
    .score-number { margin-top: 3px; font-size: 28px; line-height: 1.2; font-weight: 800; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .moves-tag { text-align: right; font-size: 11px; color: var(--muted); }
    .moves-tag strong { display: block; color: var(--ink); font-size: 19px; font-weight: 600; }
    /* 棋盘取可用区域宽高的较小值，横屏和竖屏都保持正方形 */
    .board-stage { display: grid; place-items: center; min-width: 0; min-height: 0; padding: 4px; container-type: size; }
    .board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: repeat(4, minmax(0, 1fr)); width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); gap: var(--gap); padding: var(--gap); border-radius: 14px; background: var(--board); touch-action: none; user-select: none; -webkit-user-select: none; container-type: inline-size; }
    .cell { display: grid; place-items: center; min-width: 0; min-height: 0; border-radius: 9px; background: var(--empty); color: #665477; font-size: clamp(18px, 11cqw, 68px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
    /* 修改区 2：不同数字方块的颜色，保留类名只改颜色值 */
    .tile-2 { background: #faf7ff; color: #766187; }
    .tile-4 { background: #ecdef9; color: #6f4c88; }
    .tile-8 { background: #d7bfea; color: #54366e; }
    .tile-16 { background: #bc99d8; color: #412752; }
    .tile-32 { background: #9570bf; color: #fff; }
    .tile-64 { background: #7450a3; color: #fff; }
    .tile-128 { background: #f2c481; color: #65411f; }
    .tile-256 { background: #eaaa6c; color: #58351e; }
    .tile-512 { background: #db784e; color: #fff; }
    .tile-1024 { background: #b7554d; color: #fff; }
    .tile-2048 { background: #863d65; color: #fff; box-shadow: inset 0 0 0 3px #ffffff35; }
    .tile-large { background: #3d3052; color: #fff; }
    .cell[data-digits="4"] { font-size: clamp(15px, 8cqw, 50px); }
    .cell[data-digits="5"], .cell[data-digits="6"] { font-size: clamp(11px, 5.5cqw, 36px); }
    .cell[data-digits="7"], .cell[data-digits="8"], .cell[data-digits="9"], .cell[data-digits="10"] { font-size: clamp(8px, 3.8cqw, 25px); }
    .cell.appear { animation: appear .16s ease-out; }
    .cell.merge { animation: merge .2s ease-out; }
    @keyframes appear { from { transform: scale(.68); opacity: .3; } to { transform: scale(1); opacity: 1; } }
    @keyframes merge { 0% { transform: scale(.9); } 55% { transform: scale(1.08); } 100% { transform: scale(1); } }
    .game-controls { display: grid; gap: 10px; min-width: 0; }
    .feedback { display: flex; align-items: center; gap: 9px; min-height: 34px; }
    .feedback-dot { display: grid; place-items: center; flex: 0 0 21px; height: 21px; margin-top: 1px; border-radius: 50%; background: var(--soft); color: var(--accent); font-size: 11px; }
    .feedback p { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.4; }
    .control-buttons { display: flex; align-items: center; gap: 12px; }
    .actions { display: flex; flex: 1; gap: 8px; }
    .primary, .secondary { padding: 10px 12px; border: 1px solid var(--accent); border-radius: 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
    .primary { color: white; background: var(--accent); }
    .primary:hover:enabled { background: var(--accent-hover); }
    .secondary { color: var(--accent); background: transparent; border-color: var(--line); }
    .secondary:hover:enabled { background: var(--soft); }
    .actions button { flex: 1; }
    .direction-pad { display: flex; justify-content: center; gap: 6px; }
    .direction-pad button { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 8px; color: var(--accent); background: #f5f1f9; font-size: 21px; }
    .direction-pad button:hover { background: var(--soft); }
    .keyboard-note { margin: 0; text-align: center; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--muted); font-size: 10px; line-height: 1.3; }
    .result-dialog { width: min(380px, calc(100% - 32px)); max-height: calc(100dvh - 24px); overflow: hidden; padding: 26px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper); color: var(--ink); text-align: center; box-shadow: 0 20px 80px #38265025; }
    .result-dialog::backdrop { background: #30213f66; backdrop-filter: blur(3px); }
    .result-icon { display: grid; place-items: center; width: 60px; height: 60px; margin: 0 auto 15px; border-radius: 18px; background: var(--soft); color: var(--accent); font-size: 29px; }
    .result-dialog h2 { margin: 0 0 10px; font-size: 25px; }
    .result-dialog p { margin: 0 0 20px; color: var(--muted); font-size: 13px; }
    .result-actions { display: grid; gap: 9px; }
    [hidden] { display: none !important; }
    /* 宽屏把分数和操作放到棋盘旁边，给正方形棋盘留出足够高度 */
    @media (min-aspect-ratio: 6/5) and (min-width: 760px), (orientation: landscape) and (max-height: 480px) {
      .game-card { grid-template-columns: minmax(0, 1fr) clamp(190px, 25vw, 280px); grid-template-rows: auto minmax(0, 1fr); gap: 20px; }
      .board-stage { grid-column: 1; grid-row: 1 / -1; }
      .game-info { grid-column: 2; grid-row: 1; }
      .game-controls { grid-column: 2; grid-row: 2; align-self: center; }
      .control-buttons { flex-direction: column; align-items: stretch; }
      .score-label { font-size: 9px; letter-spacing: 0; }
      .score-number { font-size: 24px; }
    }
    @media (max-width: 540px) {
      :root { --gap: 7px; }
      .shell { gap: 8px; padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
      .brand h1 { font-size: 19px; }
      .game-card { gap: 8px; padding: 12px; border-radius: 17px; }
      .score-number { font-size: 25px; }
      .cell { border-radius: 6px; }
      .control-buttons { flex-direction: column; align-items: stretch; gap: 8px; }
      .footer { flex-direction: column; gap: 2px; }
    }
    @media (max-height: 500px) {
      :root { --gap: 6px; }
      .shell { gap: 6px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
      .topbar { min-height: 32px; }
      .brand h1 { font-size: 18px; }
      .game-card { gap: 12px; padding: 10px; }
      .score-number { font-size: 21px; }
      .game-controls { gap: 6px; }
      .primary, .secondary { padding: 8px; }
      .direction-pad button { width: 36px; height: 34px; }
      .feedback p { font-size: 11px; }
      .result-dialog { padding: 16px; }
      .result-icon { display: none; }
      .result-dialog h2 { margin-bottom: 6px; font-size: 22px; }
      .result-dialog p { margin-bottom: 12px; font-size: 12px; line-height: 1.4; }
      .result-actions { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
      #continueButton { grid-column: 1 / -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><!-- 修改区 3：游戏名称，保留带 id 的标签 --><h1 id="pageTitle">合合方块</h1></div>
      <span class="target-chip">目标 <b id="titleTarget">2048</b></span>
    </header>
    <main>
        <section class="game-card" aria-label="2048 游戏区域">
          <div class="game-info score-row">
            <div><div class="score-label">本局得分 / SCORE</div><div id="score" class="score-number">0</div></div>
            <div><div class="score-label">最高纪录 / BEST</div><div id="bestScore" class="score-number">0</div></div>
            <div class="moves-tag"><strong id="moveCount">0</strong>有效步数</div>
          </div>
          <div class="board-stage"><div id="board" class="board" role="group" tabindex="0" aria-label="2048 棋盘" aria-describedby="controlNote"></div></div>
          <div class="game-controls">
            <div class="feedback" role="status" aria-live="polite" aria-atomic="true"><span class="feedback-dot" aria-hidden="true">✦</span><p id="feedback"></p></div>
            <div class="control-buttons">
              <div class="actions">
                <button id="undoButton" type="button" class="secondary" disabled>↶ 撤销一步</button>
                <button id="restartButton" type="button" class="primary">新的一局 ↗</button>
              </div>
              <div class="direction-pad" aria-label="方向按钮">
                <button type="button" data-direction="left" aria-label="向左移动">←</button>
                <button type="button" data-direction="up" aria-label="向上移动">↑</button>
                <button type="button" data-direction="down" aria-label="向下移动">↓</button>
                <button type="button" data-direction="right" aria-label="向右移动">→</button>
              </div>
            </div>
            <p id="controlNote" class="keyboard-note">方向键 / WASD 移动 · Z 撤销 · 手机滑动</p>
          </div>
        </section>
    </main>
    <!-- 修改区 4：真实姓名和班级 -->
    <footer class="footer"><span id="storageNote">本机自动存档，刷新可继续</span><span>吴雨洁 / 25会计002</span></footer>
  </div>
  <dialog id="resultDialog" class="result-dialog" aria-labelledby="resultTitle" aria-describedby="resultDetail">
    <div id="resultIcon" class="result-icon" aria-hidden="true">✦</div>
    <h2 id="resultTitle">目标达成</h2><p id="resultDetail"></p>
    <div class="result-actions">
      <button id="continueButton" class="primary" type="button">继续挑战更大的数字</button>
      <button id="resultUndoButton" class="secondary" type="button">撤销最后一步</button>
      <button id="resultRestartButton" class="secondary" type="button">重新开一局</button>
    </div>
  </dialog>
  <script>
    // 修改区 5：目标、新数字概率、开局方块数和滑动灵敏度
    const CONFIG = {
      target: 2048,
      startTiles: 2,
      fourChance: 0.1,
      swipeThreshold: 24
    };
    // 棋盘固定为四行四列，新手只改上面的参数，不改棋盘大小
    const SIZE = 4;
    // 本机存档键，用于保存当前局与最高纪录
    const STORAGE_KEY = "merge-2048-study-v1";
    const $ = (id) => document.getElementById(id);
    // 本局棋盘、分数、有效步数以及是否已达成目标
    let state = { board: [], score: 0, moves: 0, won: false, over: false };
    // 只保存最近一次有效移动前的状态，每次移动后最多撤销一次
    let previous = null;
    let bestScore = 0;
    let storageAvailable = true;
    let highlights = { spawned: [], merged: [] };
    let pointerStart = null;

    // 核心规则开始：这些函数不依赖页面，可单独验证
    // 先去空格，相邻同值只合并一次，再在末尾补零
    function mergeLine(line) {
      const numbers = line.filter((value) => value !== 0);
      const result = [];
      const mergedPositions = [];
      let gained = 0;
      for (let index = 0; index < numbers.length; index += 1) {
        if (numbers[index] === numbers[index + 1]) {
          const merged = numbers[index] * 2;
          mergedPositions.push(result.length);
          result.push(merged);
          gained += merged;
          index += 1;
        } else {
          result.push(numbers[index]);
        }
      }
      while (result.length < SIZE) {
        result.push(0);
      }
      return { values: result, gained: gained, mergedPositions: mergedPositions };
    }

    // 通过坐标读取顺序，把上下左右统一成朝前合并
    function lineCells(direction, lineIndex) {
      const cells = [];
      for (let index = 0; index < SIZE; index += 1) {
        if (direction === "left") {
          cells.push([lineIndex, index]);
        } else if (direction === "right") {
          cells.push([lineIndex, SIZE - 1 - index]);
        } else if (direction === "up") {
          cells.push([index, lineIndex]);
        } else {
          cells.push([SIZE - 1 - index, lineIndex]);
        }
      }
      return cells;
    }

    // 计算新棋盘、合并分数与动画坐标，保持原棋盘不变
    function calculateMove(source, direction) {
      const next = source.map((row) => row.slice());
      const mergedCells = [];
      let gained = 0;
      for (let lineIndex = 0; lineIndex < SIZE; lineIndex += 1) {
        const cells = lineCells(direction, lineIndex);
        const line = cells.map(([row, column]) => source[row][column]);
        const merged = mergeLine(line);
        gained += merged.gained;
        for (let index = 0; index < SIZE; index += 1) {
          const [row, column] = cells[index];
          next[row][column] = merged.values[index];
        }
        for (const position of merged.mergedPositions) {
          mergedCells.push(cells[position].join(":"));
        }
      }
      return { board: next, gained: gained, changed: JSON.stringify(next) !== JSON.stringify(source), mergedCells: mergedCells };
    }

    // 棋盘填满不代表结束，还要检查横竖相邻是否能合并
    function hasMoves(source) {
      for (let row = 0; row < SIZE; row += 1) {
        for (let column = 0; column < SIZE; column += 1) {
          const value = source[row][column];
          if (value === 0) {
            return true;
          }
          if (column + 1 < SIZE && value === source[row][column + 1]) {
            return true;
          }
          if (row + 1 < SIZE && value === source[row + 1][column]) {
            return true;
          }
        }
      }
      return false;
    }
    // 核心规则结束

    // 空格中只生成一个 2 或 4，返回该格坐标供动画使用
    function addRandomTile() {
      const empty = [];
      for (let row = 0; row < SIZE; row += 1) {
        for (let column = 0; column < SIZE; column += 1) {
          if (state.board[row][column] === 0) {
            empty.push([row, column]);
          }
        }
      }
      if (empty.length === 0) {
        return null;
      }
      const [row, column] = empty[Math.floor(Math.random() * empty.length)];
      state.board[row][column] = Math.random() < CONFIG.fourChance ? 4 : 2;
      return row + ":" + column;
    }

    // 存档只接收四乘四棋盘，非空数字必须是 2 的整数次幂
    function validBoard(board) {
      if (!Array.isArray(board) || board.length !== SIZE) {
        return false;
      }
      const valid = board.every((row) => {
        return Array.isArray(row) && row.length === SIZE && row.every((value) => {
          return value === 0 || (Number.isSafeInteger(value) && value >= 2 && value <= 2 ** 30 && Number.isInteger(Math.log2(value)));
        });
      });
      return valid && board.flat().some((value) => value > 0);
    }

    // 读取汇总纪录与当前局，损坏的存档被忽略，目标变更后开新局
    function loadGame() {
      let storedText;
      try {
        storedText = localStorage.getItem(STORAGE_KEY);
      } catch (error) {
        storageAvailable = false;
        return false;
      }
      try {
        const saved = JSON.parse(storedText);
        if (!saved || typeof saved !== "object") {
          return false;
        }
        if (Number.isSafeInteger(saved.best) && saved.best >= 0) {
          bestScore = saved.best;
        }
        const game = saved.game;
        if (!game || game.target !== CONFIG.target || !validBoard(game.board)) {
          return false;
        }
        if (!Number.isSafeInteger(game.score) || game.score < 0 || !Number.isSafeInteger(game.moves) || game.moves < 0 || typeof game.won !== "boolean") {
          return false;
        }
        state = { board: game.board, score: game.score, moves: game.moves, won: game.won, over: !hasMoves(game.board) };
        bestScore = Math.max(bestScore, state.score);
        return true;
      } catch (error) {
        return false;
      }
    }

    // 保存当前棋盘与最高分，失败时降级为仅当前页面可玩
    function saveGame() {
      const saved = { best: bestScore, game: { board: state.board, score: state.score, moves: state.moves, won: state.won, target: CONFIG.target } };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(saved));
        storageAvailable = true;
      } catch (error) {
        storageAvailable = false;
      }
    }

    // 渲染十六格棋盘，同时更新得分、页头目标与撤销按钮
    function render() {
      $("board").replaceChildren();
      for (let row = 0; row < SIZE; row += 1) {
        for (let column = 0; column < SIZE; column += 1) {
          const value = state.board[row][column];
          const cell = document.createElement("div");
          cell.className = "cell";
          cell.dataset.value = value;
          cell.dataset.digits = String(value).length;
          if (value > 0) {
            cell.textContent = value;
            cell.classList.add(value <= 2048 ? "tile-" + value : "tile-large");
          }
          const position = row + ":" + column;
          if (highlights.spawned.includes(position)) {
            cell.classList.add("appear");
          }
          if (highlights.merged.includes(position)) {
            cell.classList.add("merge");
          }
          cell.setAttribute("aria-label", "第 " + (row + 1) + " 行第 " + (column + 1) + " 列，" + (value === 0 ? "空格" : value));
          $("board").appendChild(cell);
        }
      }
      $("score").textContent = state.score;
      $("bestScore").textContent = bestScore;
      $("moveCount").textContent = state.moves;
      $("titleTarget").textContent = CONFIG.target;
      $("board").setAttribute("aria-label", CONFIG.target + " 棋盘");
      $("undoButton").disabled = previous === null;
      $("storageNote").textContent = storageAvailable ? "本机自动存档，刷新可继续" : "浏览器存储不可用，刷新会丢失本局";
    }

    // 显示达标或结束提示，使用原生对话框保留键盘操作能力
    function showResult(kind) {
      const won = kind === "win";
      $("resultIcon").textContent = won ? "✦" : "↶";
      $("resultTitle").textContent = won ? "合成 " + CONFIG.target + " 了！" : "这一局，也很精彩";
      let detail = "你走了 " + state.moves + " 步，获得 " + state.score + " 分。";
      if (won && !state.over) {
        detail += "目标达成，继续挑战更大的数字吧";
      } else if (previous !== null) {
        detail += "已经没有可用移动，可以撤销最后一步或重新开始";
      } else {
        detail += "已经没有可用移动，重新开一局吧";
      }
      $("resultDetail").textContent = detail;
      $("continueButton").hidden = !won || state.over;
      $("resultUndoButton").hidden = previous === null;
      if (!$("resultDialog").open) {
        $("resultDialog").showModal();
      }
    }

    // 检查达标与无路可走，先承认目标达成，再说明是否还能继续
    function checkResult() {
      state.over = !hasMoves(state.board);
      const justWon = !state.won && Math.max(...state.board.flat()) >= CONFIG.target;
      if (justWon) {
        state.won = true;
        $("feedback").textContent = "目标达成！已经合成 " + CONFIG.target + "，本局得分 " + state.score;
      } else if (state.over) {
        $("feedback").textContent = previous !== null ? "没有可用移动了，可以撤销最后一步或重新开局" : "没有可用移动了，可以重新开一局";
      }
      saveGame();
      render();
      if (justWon) {
        showResult("win");
      } else if (state.over) {
        showResult("lose");
      }
    }

    // 无效移动不产生方块、不增加步数，也不覆盖可用的撤销记录
    function move(direction) {
      if (state.over || $("resultDialog").open) {
        return;
      }
      const result = calculateMove(state.board, direction);
      if (!result.changed) {
        $("feedback").textContent = "这个方向暂时移不动，换个方向吧；不会增加新方块";
        return;
      }
      previous = { board: state.board.map((row) => row.slice()), score: state.score, moves: state.moves, won: state.won, over: state.over };
      state.board = result.board;
      state.score += result.gained;
      state.moves += 1;
      bestScore = Math.max(bestScore, state.score);
      const spawned = addRandomTile();
      highlights = { spawned: spawned ? [spawned] : [], merged: result.mergedCells };
      const names = { left: "左", right: "右", up: "上", down: "下" };
      $("feedback").textContent = "已向" + names[direction] + "移动，" + (result.gained > 0 ? "合并获得 " + result.gained + " 分" : "这一步没有合并") + "，新增了一个方块";
      checkResult();
    }

    // 撤销最近一次有效移动，最高纪录保留，不支持连续回退多步
    function undo() {
      if (previous === null) {
        return;
      }
      state = previous;
      previous = null;
      highlights = { spawned: [], merged: [] };
      if ($("resultDialog").open) {
        $("resultDialog").close();
      }
      $("feedback").textContent = "已撤销上一步，分数与步数已恢复，最高纪录保留";
      saveGame();
      render();
      $("board").focus({ preventScroll: true });
    }

    // 新局清空棋盘和本局分数，保留本机最高纪录
    function startGame(focusBoard = true) {
      state = { board: Array.from({ length: SIZE }, () => Array(SIZE).fill(0)), score: 0, moves: 0, won: false, over: false };
      previous = null;
      highlights = { spawned: [], merged: [] };
      pointerStart = null;
      for (let index = 0; index < CONFIG.startTiles; index += 1) {
        const position = addRandomTile();
        if (position) {
          highlights.spawned.push(position);
        }
      }
      if ($("resultDialog").open) {
        $("resultDialog").close();
      }
      $("feedback").textContent = "新的一局。方向键、WASD 或滑动棋盘，开始合并吧";
      saveGame();
      render();
      if (focusBoard) {
        $("board").focus({ preventScroll: true });
      }
    }

    // 键盘事件统一调用移动和撤销，避免方向键滚动网页
    const keys = { ArrowLeft: "left", ArrowRight: "right", ArrowUp: "up", ArrowDown: "down", a: "left", d: "right", w: "up", s: "down" };
    document.addEventListener("keydown", (event) => {
      if (event.ctrlKey || event.altKey || event.metaKey || $("resultDialog").open) {
        return;
      }
      if (["INPUT", "TEXTAREA", "SELECT"].includes(event.target.tagName)) {
        return;
      }
      const key = event.key.length === 1 ? event.key.toLowerCase() : event.key;
      if (keys[key]) {
        event.preventDefault();
        move(keys[key]);
      } else if (key === "z") {
        event.preventDefault();
        undo();
      }
    });

    // 触控在棋盘区域识别方向，页面保持固定不滚动
    $("board").addEventListener("pointerdown", (event) => {
      if (event.pointerType === "mouse" || !event.isPrimary || state.over || $("resultDialog").open) {
        return;
      }
      pointerStart = { id: event.pointerId, x: event.clientX, y: event.clientY };
      $("board").setPointerCapture(event.pointerId);
    });
    $("board").addEventListener("pointerup", (event) => {
      if (!pointerStart || pointerStart.id !== event.pointerId) {
        return;
      }
      const dx = event.clientX - pointerStart.x;
      const dy = event.clientY - pointerStart.y;
      pointerStart = null;
      if (Math.max(Math.abs(dx), Math.abs(dy)) < CONFIG.swipeThreshold) {
        return;
      }
      if (Math.abs(dx) > Math.abs(dy)) {
        move(dx > 0 ? "right" : "left");
      } else {
        move(dy > 0 ? "down" : "up");
      }
    });
    $("board").addEventListener("pointercancel", () => {
      pointerStart = null;
    });
    for (const button of document.querySelectorAll("[data-direction]")) {
      button.addEventListener("click", () => {
        move(button.dataset.direction);
      });
    }
    $("restartButton").addEventListener("click", () => {
      startGame();
    });
    $("resultRestartButton").addEventListener("click", () => {
      startGame();
    });
    $("undoButton").addEventListener("click", undo);
    $("resultUndoButton").addEventListener("click", undo);
    $("continueButton").addEventListener("click", () => {
      $("resultDialog").close();
      $("feedback").textContent = "继续挑战！已经达成的目标不会重复弹出提示";
      $("board").focus({ preventScroll: true });
    });

    // 有有效存档就恢复，否则开始新局，刷新后不保留撤销记录
    if (loadGame()) {
      $("feedback").textContent = "已恢复上次棋盘、分数与步数，接着合并吧";
      checkResult();
    } else {
      startGame(false);
    }
  </script>
</body>
</html>
